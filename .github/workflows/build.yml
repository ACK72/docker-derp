name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '21 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the image's Go toolchain for security checks
        id: go
        run: |
          version=$(sed -n 's/.*golang:\([0-9][0-9.]*\)-.*/\1/p' Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: Verify dependencies and reachable vulnerabilities
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go tool govulncheck tailscale.com/cmd/derper tailscale.com/cmd/derpprobe
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: derp:test
          pull: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Test TLS, relay, STUN and client verification
        run: bash scripts/smoke-test.sh derp:test

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and version
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'Skipping publication of an outdated commit.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(bash scripts/version.sh)
          image="ghcr.io/${REPOSITORY,,}"
          build="$version-$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          {
            echo 'publish=true'
            echo "name=$image"
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.publish == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.image.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures
        id: push
        if: steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          build-args: IMAGE_VERSION=${{ steps.image.outputs.build }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.build }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.build }}
            org.opencontainers.image.licenses=BSD-3-Clause
            org.opencontainers.image.description=Tailscale DERP server and probe
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
      - name: Verify published platforms
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
